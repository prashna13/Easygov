name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ── Backend (FastAPI) test suite ────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          # Tests run in lite mode (no embedding model / Chroma / LLM load),
          # so they are fast, offline and deterministic.
          EASYGOV_LITE: "1"
          JWT_SECRET_KEY: "ci-test-secret"
        run: python -m pytest tests -q

  # ── Android JVM unit tests ─────────────────────────────────────────────────
  android-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Easygov_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest

  # ── Android Espresso (device) tests ────────────────────────────────────────
  android-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Easygov_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd Easygov_mobile && ./gradlew :app:connectedDebugAndroidTest
